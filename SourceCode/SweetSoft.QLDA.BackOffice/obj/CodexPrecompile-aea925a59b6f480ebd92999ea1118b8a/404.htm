<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />

    <title>404 | Page not found</title>

    <style>
        *, ::after, ::before {
            -webkit-box-sizing: border-box;
            -o-box-sizing: border-box;
            -mos-box-sizing: border-box;
            -ms-box-sizing: border-box;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.4;
        }
        .wrap_notfound {
            position: relative;
            height: 100vh;
            padding: 0 15px;
        }
        .wrap_notfound .notfound {
            position: absolute;
            left: 50%;
            top: 50%;
            -webkit-transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
            -o-transform: translate(-50%, -50%);
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            padding: 0 15px;
        }
        .height_notfound {
            height: 255px;
        }
        .notfound {
            max-width: 100%;
            width: 100%;
            text-align: center;
            line-height: 1.4;
        }
        .notfound .notfound-404 {
            position: relative;
            width: 180px;
            height: 180px;
            margin: auto;
            -webkit-transform: translate(0, 37px);
            -mos-transform: translate(0, 37px);
            -ms-transform: translate(0, 37px);
            -o-transform: translate(0, 37px);
            transform: translate(0, 37px);
        }
        .notfound .notfound-404 > div:first-child {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: #ffa200;
            -webkit-transform: rotate(45deg);
            -ms-transform: rotate(45deg);
            transform: rotate(45deg);
            border: 5px dashed #000;
            border-radius: 5px;
        }
        .notfound .notfound-404 > div:first-child:before {
            content: "";
            position: absolute;
            left: -5px;
            right: -5px;
            bottom: -5px;
            top: -5px;
            -webkit-box-shadow: 0 0 0 5px rgba(0, 0, 0, 0.1) inset;
            box-shadow: 0 0 0 5px rgba(0, 0, 0, 0.1) inset;
            border-radius: 5px;
        }
        .notfound .notfound-404 h1 {
            font-family: cabin, sans-serif;
            color: #000;
            font-weight: 700;
            margin: 0;
            font-size: 90px;
            position: absolute;
            top: 50%;
            -webkit-transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            left: 50%;
            text-align: center;
            height: 40px;
            line-height: 40px;
        }
        .notfound h2 {
            font-family: cabin, sans-serif;
            font-size: 33px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 7px;
            text-align: center;
        }
        .notfound p {
            font-family: cabin, sans-serif;
            font-size: 16px;
            color: #000;
            font-weight: 400;
        }
        .notfound a {
            font-family: cabin, sans-serif;
            display: inline-block;
            padding: 10px 25px;
            background-color: #8f8f8f;
            border: none;
            border-radius: 40px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            -webkit-transition: 0.2s all;
            transition: 0.2s all;
        }
        .notfound a:hover {
            background-color: #2c2c2c;
        }

        @media screen and (max-width: 991px) and (max-height: 575px) {
            .wrap_notfound {
                position: relative;
                height: 150vh;
            }
        }

        @media screen and (max-width: 991px) {
            .notfound h2 {
                font-size: 24px;
            }
        }

        @media screen and (max-width: 575px) {
            .notfound {
                max-width: 575px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap_notfound">
        <div class="notfound">
            <div class="height_notfound">
                <div class="notfound-404">
                    <div></div>

                    <h1>404</h1>
                </div>
            </div>

            <h2 style="margin-bottom: 15px;">Page not found</h2>

            <p style="margin-bottom: 15px;">The page you are accessing might have been removed had its name changed or is temporarily unavailable.</p>

            <a href="javascript:void(0);" id="go-back" title="Back">Back</a>

            <a href="/" id="go-home" title="Home">Home <span id="showTimer">(05)</span></a>
        </div>
    </div>

    <script>
        function startTimer(duration, display) {
            var timer = duration, minutes, seconds;
            myInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? + seconds : seconds;

                document.getElementById(display).innerText = "("+ seconds +")";

                if (--timer < 0) {
                    clearInterval(myInterval);
                    window.location = '/';
                }
            }, 1000);
        }

        startTimer(5, 'showTimer');

        // back page
        document.getElementById("go-back").addEventListener("click", () => {
            history.back();
        });
    </script>
</body>

</html>
